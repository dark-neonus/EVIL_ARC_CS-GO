# =============================================================================
# SALR Particle Simulation — Default Configuration
# =============================================================================
# This config defines a small 2D test case for quick validation.
# All lengths are in reduced units (σ=1).

[grid]
# Number of grid points along each axis
nx = 64
ny = 64
nz = 1          # nz=1 → effectively 2D problem

# Physical size of the simulation box (in σ)
Lx = 10.0
Ly = 10.0
Lz = 0.0

[potential]
# SALR potential parameters: u(r) = -ε_a * exp(-r/σ_a) + ε_r * exp(-r/σ_r)
epsilon_attract = 1.0       # attraction strength
sigma_attract   = 1.0       # attraction range
epsilon_repulse = 0.5       # repulsion strength
sigma_repulse   = 2.0       # repulsion range

[solver]
max_iterations  = 1000      # maximum Picard iterations
tolerance       = 1.0e-6    # convergence threshold (L2 norm of density change)
mixing_param    = 0.01      # Picard mixing parameter α: ρ_new = (1-α)ρ_old + α·ρ_calc

[physics]
temperature     = 1.0       # kT in reduced units
bulk_density    = 0.3       # average number density ρ_0

[walls]
# Confinement between two hard walls perpendicular to z-axis
wall_separation = 10.0      # distance between walls (Lz used if nz>1)

[output]
output_dir      = output/
save_every      = 100       # save density profile every N iterations
save_final      = true      # always save the converged result

[integral]
# 2D integration settings (for learning / test programs)
method          = rectangle # rectangle | trapezoidal | simpson
shape           = circle    # circle | triangle
radius          = 1.0       # circle radius or triangle side
