# =============================================================================
# SALR Particle Simulation — 3D Test Configuration
# =============================================================================
# Full 3D grid for production runs. Requires GPU for reasonable runtime.

[grid]
nx = 64
ny = 64
nz = 64

Lx = 10.0
Ly = 10.0
Lz = 10.0

[potential]
epsilon_attract = 1.0
sigma_attract   = 1.0
epsilon_repulse = 0.5
sigma_repulse   = 2.0

[solver]
max_iterations  = 5000
tolerance       = 1.0e-7
mixing_param    = 0.005

[physics]
temperature     = 1.0
bulk_density    = 0.3

[walls]
wall_separation = 10.0

[output]
output_dir      = output/
save_every      = 500
save_final      = true
